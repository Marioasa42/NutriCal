name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si empujas dos veces seguidas, cancela la ejecución anterior de esta misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formato, lint, tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm ci` instala exactamente lo que dice package-lock.json y falla si el
      # lockfile no concuerda con package.json. `npm install` podría actualizar
      # versiones por su cuenta y hacer que CI pruebe algo distinto a tu local.
      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build de producción
        run: npm run build
